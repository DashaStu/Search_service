version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: search_db
    ports:
      - "5460:5432"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/search_db
      ELASTIC_URL: http://elasticsearch:9200

  tests:
    build: .
    command: ["pytest", "-v"]
    depends_on:
      - app
      - db
      - elasticsearch
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/search_db
      ELASTIC_URL: http://elasticsearch:9200